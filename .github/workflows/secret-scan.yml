# 시크릿 유출 검사 — 전 저장소 공용 (재사용 워크플로)
#
# 각 저장소는 이 파일을 호출만 한다:
#   jobs:
#     scan:
#       uses: tuinfo/.github/.github/workflows/secret-scan.yml@main
#
# 동작
#   pull_request  → PR 에 들어온 커밋 범위만 검사 (base..head)
#   push (main)   → 이번 push 범위만 검사 (before..sha)
#   full-history  → 전체 이력 검사 (수동 실행·최초 점검용)
#
# 검출 시 job 실패. 값은 --redact 로 가려 로그에 남지 않는다.
# 오탐은 해당 저장소 루트의 .gitleaks.toml(allowlist) 또는 .gitleaksignore(fingerprint) 로 제외.
name: secret-scan

on:
  workflow_call:
    inputs:
      full-history:
        description: 전체 이력 검사
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks 설치
        env:
          VER: 8.30.1
        run: |
          curl -sSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: 검사 범위 결정
        id: range
        env:
          FULL: ${{ inputs.full-history }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$FULL" = "true" ] || [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "opts=" >> "$GITHUB_OUTPUT"
            echo "범위: 전체 이력"
          else
            echo "opts=--log-opts=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
            echo "범위: ${BASE:0:7}..${HEAD:0:7} ($(git rev-list --count "${BASE}..${HEAD}") 커밋)"
          fi

      - name: 검사
        run: /tmp/gitleaks git --redact --no-banner -v ${{ steps.range.outputs.opts }} .
