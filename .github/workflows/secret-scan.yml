# 시크릿 유출 검사 — 전 저장소 공용 (재사용 워크플로)
#
# 각 저장소는 이 파일을 호출만 한다:
#   jobs:
#     scan:
#       uses: tuinfo/.github/.github/workflows/secret-scan.yml@main
#
# 동작
#   pull_request  → PR 에 들어온 커밋 범위만 검사 (base..head)
#   push (main)   → 이번 push 범위만 검사 (before..sha)
#   full-history  → 전체 이력 검사 (수동 실행·최초 점검용)
#
# 검출 시 job 실패. 값은 --redact 로 가려 로그에 남지 않는다.
# 오탐은 해당 저장소 루트의 .gitleaks.toml(allowlist) 또는 .gitleaksignore(fingerprint) 로 제외.
name: secret-scan

on:
  workflow_call:
    inputs:
      full-history:
        description: 전체 이력 검사
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 내려받기 — HTTP 오류(504 등)는 바로 실패로 보고 재시도, 받은 파일은 고정 sha256 으로 검증 (handoffs #444)
      #   버전을 올릴 때는 SHA256 도 같이: 릴리스의 gitleaks_<버전>_checksums.txt 에서 linux_x64.tar.gz 줄
      - name: gitleaks 설치
        env:
          VER: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          ok=""
          for i in 1 2 3; do
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 180 -o /tmp/gl.tgz "$URL"; then ok=1; break; fi
            echo "::warning::gitleaks 내려받기 실패 ($i/3)"
            [ "$i" = 3 ] || sleep 60
          done
          [ -n "$ok" ] || { echo "::error::gitleaks 를 내려받지 못함 (GitHub 릴리스 장애일 수 있음 — 비밀값 검출 아님, 잠시 뒤 재실행)"; exit 1; }
          echo "$SHA256  /tmp/gl.tgz" | sha256sum -c - || { echo "::error::gitleaks 파일 sha256 불일치 — 비밀값 검출 아님, 받은 파일이 다름"; exit 1; }
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: 검사 범위 결정
        id: range
        env:
          FULL: ${{ inputs.full-history }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$FULL" = "true" ] || [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "opts=" >> "$GITHUB_OUTPUT"
            echo "범위: 전체 이력"
          else
            echo "opts=--log-opts=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
            echo "범위: ${BASE:0:7}..${HEAD:0:7} ($(git rev-list --count "${BASE}..${HEAD}") 커밋)"
          fi

      - name: 검사
        run: /tmp/gitleaks git --redact --no-banner -v ${{ steps.range.outputs.opts }} .
